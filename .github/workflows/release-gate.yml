name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare validation artifacts
        run: mkdir -p artifacts/test-results artifacts/build-logs

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/test-results/lint.log

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=junit --outputFile.junit=artifacts/test-results/vitest.junit.xml 2>&1 | tee artifacts/test-results/vitest.log

      - name: Runtime tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:runtime -- --reporter=default --reporter=junit --outputFile.junit=artifacts/test-results/runtime.junit.xml 2>&1 | tee artifacts/test-results/runtime.log

      - name: Coverage report
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee artifacts/test-results/coverage.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/build-logs/build.log

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-artifacts-${{ github.run_id }}
          path: |
            artifacts/test-results/
            artifacts/build-logs/
            coverage/
          if-no-files-found: warn
          retention-days: 14

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install detect-secrets
        run: python -m pip install --upgrade pip detect-secrets

      - name: Scan repository for secrets
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/security
          detect-secrets scan --all-files --force-use-all-plugins > artifacts/security/detect-secrets.json
          python - <<'PY'
          import json
          import sys

          with open("artifacts/security/detect-secrets.json", "r", encoding="utf-8") as fh:
              results = json.load(fh).get("results", {})

          findings = {path: entries for path, entries in results.items() if entries}
          count = sum(len(entries) for entries in findings.values())
          if count:
              print(f"Detected {count} potential secret(s):")
              for path, entries in findings.items():
                  print(f"- {path}: {len(entries)}")
              sys.exit(1)

          print("No secrets detected.")
          PY

      - name: Upload secret scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-scan-artifacts-${{ github.run_id }}
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 14
